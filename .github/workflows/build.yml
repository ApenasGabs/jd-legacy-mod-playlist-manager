name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install nuitka zstandard pyside6

      - name: Build with Nuitka
        shell: pwsh
        run: |
          cd app
          $env:PYTHONPATH="src"
          python -m nuitka --standalone --onefile --mingw64 --show-progress --windows-console-mode=disable --plugin-enable=pyside6 --include-package=core --include-package=services --include-package=ui --include-package=utils --include-package=workers --include-data-dir=resources=resources --include-data-dir=src=src --windows-icon-from-ico=resources/gui/icon.ico --output-filename=JD2022LMPlaylistManager --assume-yes-for-downloads --quiet --remove-output --no-deployment-flag=self-execution --output-dir=build_output main.py

      - name: Prepare Release Files
        shell: pwsh
        run: |
          mkdir release_dist
          # Ajustado para o caminho da pasta build_output
          cp app/build_output/JD2022LMPlaylistManager.exe release_dist/
          mkdir release_dist/runtime
          cp app/runtime/songs.json release_dist/runtime/
          Compress-Archive -Path release_dist/* -DestinationPath JD2022LMPlaylistManager.zip

      - name: Generate SHA-256 Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256).Hash
          echo "ZIP_HASH=$hash" >> $env:GITHUB_ENV
          echo "-------------------------------------------------------"
          echo "SHA-256 Hash for JD2022LMPlaylistManager.zip:"
          echo $hash
          echo "-------------------------------------------------------"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: JD2022LMPlaylistManager.zip
          name: Release ${{ github.ref_name }}
          body: |
            ### Security Verification
            **SHA-256 Hash:** `${{ env.ZIP_HASH }}`
            
            To verify the integrity of the file, run the following command in PowerShell:
            `Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}