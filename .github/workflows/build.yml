name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pyside6 zstandard


      - name: Build and Prepare Release Files
        shell: pwsh
        run: |
          cd app
          # Build with cx_Freeze
          python setup.py build
          # Create main release folder
          $releaseDir = "JD2022LMPlaylistManager"
          mkdir $releaseDir
          # Copy all built files and folders to the release folder
          cp -r build_output/* $releaseDir/
          # Ensure runtime/songs.json exists in the correct place (redundant, but safe)
          cp runtime/songs.json $releaseDir/runtime/
          # Zip the entire folder (structure: JD2022LMPlaylistManager/ with all files inside)
          Compress-Archive -Path $releaseDir -DestinationPath ../JD2022LMPlaylistManager.zip

      - name: Generate SHA-256 Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256).Hash
          echo "ZIP_HASH=$hash" >> $env:GITHUB_ENV
          echo "SHA-256: $hash"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: JD2022LMPlaylistManager.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Distribution Details
            
            This release contains the standalone version of the JD2022LMPlaylistManager.
            
            ### Installation
            1. Download and extract the `JD2022LMPlaylistManager.zip` file.
            2. Run the `JD2022LMPlaylistManager.exe` file.
            
            ### Security Verification
            **SHA-256 Hash:** `${{ env.ZIP_HASH }}`
            
            To verify the file integrity via PowerShell:
            `Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}