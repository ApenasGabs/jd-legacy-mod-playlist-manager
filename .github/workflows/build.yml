name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pyside6 zstandard cx_Freeze

      - name: Build and Prepare Release Files
        shell: pwsh
        run: |
          cd app
          python setup.py build
          $releaseDir = "JD2022LMPlaylistManager"
          mkdir $releaseDir
          cp -r build_output/* $releaseDir/
          cp runtime/songs.json $releaseDir/runtime/
          Compress-Archive -Path $releaseDir -DestinationPath ../JD2022LMPlaylistManager.zip

      - name: Generate SHA-256 Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256).Hash
          echo "$hash" > ./windows-hash.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            JD2022LMPlaylistManager.zip
            windows-hash.txt

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pyside6 zstandard cx_Freeze
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build and Prepare AppImage
        run: |
          cd app
          # Convert icon
          magick resources/gui/icon.ico resources/gui/icon.png
          
          # Build with cx_Freeze
          python setup.py build
          
          # Prepare AppDir
          mkdir -p AppDir/usr/bin
          cp -r build_output/* AppDir/usr/bin/
          mkdir -p AppDir/usr/bin/runtime
          cp runtime/songs.json AppDir/usr/bin/runtime/
          
          # Create .desktop file
          cat <<EOF > AppDir/JD2022LMPlaylistManager.desktop
          [Desktop Entry]
          Name=JD2022LMPlaylistManager
          Exec=JD2022LMPlaylistManager
          Icon=icon
          Type=Application
          Categories=Utility;
          EOF
          
          # Copy icon and set up AppRun
          cp resources/gui/icon.png AppDir/icon.png
          ln -s usr/bin/JD2022LMPlaylistManager AppDir/AppRun
          
          # Download appimagetool
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool AppDir ../JD2022LMPlaylistManager-x86_64.AppImage

      - name: Generate SHA-256 Hash
        run: |
          hash=$(sha256sum JD2022LMPlaylistManager-x86_64.AppImage | awk '{ print $1 }')
          echo "$hash" > ./linux-hash.txt

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            JD2022LMPlaylistManager-x86_64.AppImage
            linux-hash.txt

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Read Hashes
        id: hashes
        run: |
          win_hash=$(cat windows-hash.txt)
          lin_hash=$(cat linux-hash.txt)
          echo "WIN_HASH=$win_hash" >> $GITHUB_ENV
          echo "LIN_HASH=$lin_hash" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            JD2022LMPlaylistManager.zip
            JD2022LMPlaylistManager-x86_64.AppImage
          name: Release ${{ github.ref_name }}
          body: |
            ## Distribution Details
            
            This release contains the standalone version of the JD2022LMPlaylistManager.
            
            ### Windows Installation
            1. Download and extract the `JD2022LMPlaylistManager.zip` file.
            2. Run the `JD2022LMPlaylistManager.exe` file.
            
            ### Linux Installation
            1. Download the `JD2022LMPlaylistManager-x86_64.AppImage` file.
            2. Make it executable: `chmod +x JD2022LMPlaylistManager-x86_64.AppImage`
            3. Run it: `./JD2022LMPlaylistManager-x86_64.AppImage`
            
            ### Security Verification
            
            **Windows SHA-256 Hash:** `${{ env.WIN_HASH }}`
            To verify the file integrity via PowerShell:
            `Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256`
            
            **Linux SHA-256 Hash:** `${{ env.LIN_HASH }}`
            To verify the file integrity via terminal:
            `sha256sum ./JD2022LMPlaylistManager-x86_64.AppImage`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}