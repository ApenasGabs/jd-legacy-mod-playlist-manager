name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install nuitka zstandard pyside6

      - name: Build with Nuitka
        shell: pwsh
        run: |
          cd app
          $env:PYTHONPATH="src"
          python -m nuitka --standalone --mingw64 --show-progress --show-memory --windows-console-mode=disable --plugin-enable=pyside6 --include-package=core --include-package=services --include-package=ui --include-package=utils --include-package=workers --include-data-dir=resources=resources --include-data-dir=src=src --windows-icon-from-ico=resources/gui/icon.ico --output-filename=JD2022LMPlaylistManager --assume-yes-for-downloads --remove-output --no-deployment-flag=self-execution --output-dir=build_output main.py

      - name: Prepare Release Files
        shell: pwsh
        run: |
          # Create main release folder
          $releaseDir = "JD2022LMPlaylistManager"
          $dllDir = "$releaseDir/dlls"
          mkdir $releaseDir
          mkdir $dllDir
          # Copy all Nuitka build output files/folders into a temp folder
          cp -r app/build_output/main.dist/* $releaseDir/
          # Move all DLLs and PYD files to dlls subfolder
          Get-ChildItem -Path $releaseDir -Include *.dll,*.pyd -File | ForEach-Object { Move-Item $_.FullName $dllDir }
          # Move the main executable to the root and rename if needed
          if (Test-Path "$releaseDir/main.exe") {
            Move-Item "$releaseDir/main.exe" "$releaseDir/JD2022LMPlaylistManager.exe"
          }
          # Ensure runtime folder exists and copy songs.json
          mkdir -p $releaseDir/runtime
          cp app/runtime/songs.json $releaseDir/runtime/
          # Zip the entire folder (structure: JD2022LMPlaylistManager/contents...)
          Compress-Archive -Path $releaseDir -DestinationPath JD2022LMPlaylistManager.zip

      - name: Generate SHA-256 Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256).Hash
          echo "ZIP_HASH=$hash" >> $env:GITHUB_ENV
          echo "SHA-256: $hash"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: JD2022LMPlaylistManager.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Distribution Details
            
            This release contains the standalone version of the JD2022LMPlaylistManager.
            
            ### Installation
            1. Download and extract the `JD2022LMPlaylistManager.zip` file.
            2. Run the `JD2022LMPlaylistManager.exe` file.
            
            ### Security Verification
            **SHA-256 Hash:** `${{ env.ZIP_HASH }}`
            
            To verify the file integrity via PowerShell:
            `Get-FileHash ./JD2022LMPlaylistManager.zip -Algorithm SHA256`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}